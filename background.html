<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Sky - Sleek Black Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Pure black background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: -2;
        }

        /* Animated floating orbs with subtle glow */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.4;
            mix-blend-mode: screen;
        }

        .orb1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #00d4ff, transparent);
            top: -100px;
            left: -100px;
            animation: float 8s ease-in-out infinite;
        }

        .orb2 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #00a8ff, transparent);
            bottom: -80px;
            right: -50px;
            animation: float 10s ease-in-out infinite reverse;
        }

        .orb3 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #0099ff, transparent);
            top: 50%;
            right: 10%;
            animation: float 12s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-50px) translateX(20px); }
        }

        /* Minimal grid pattern - very subtle */
        .grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 212, 255, 0.02) 25%, rgba(0, 212, 255, 0.02) 26%, transparent 27%, transparent 74%, rgba(0, 212, 255, 0.02) 75%, rgba(0, 212, 255, 0.02) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 212, 255, 0.02) 25%, rgba(0, 212, 255, 0.02) 26%, transparent 27%, transparent 74%, rgba(0, 212, 255, 0.02) 75%, rgba(0, 212, 255, 0.02) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            z-index: -1;
        }

        /* Content container */
        .content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            color: #ffffff;
            z-index: 1;
        }

        .title {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            letter-spacing: 2px;
            animation: fadeInDown 1s ease;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #00d4ff;
            margin-bottom: 2rem;
            opacity: 0.9;
            animation: fadeInUp 1s ease;
        }

        .button {
            padding: 12px 30px;
            border: 2px solid #00d4ff;
            background: transparent;
            color: #00d4ff;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: fadeInUp 1.2s ease;
        }

        .button:hover {
            background: #00d4ff;
            color: #000000;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            transform: translateY(-3px);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            .subtitle {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="grid"></div>
    
    <div class="content">
        <h1 class="title">Silver Sky</h1>
        <p class="subtitle">A sleek and modern experience</p>
        <button class="button">Get Started</button>
    </div>
</body>
</html>
